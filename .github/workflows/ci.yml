name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: flutter pub get
      - run: flutter analyze
      - name: Start the local hub + sshd + gateway stand-in
        run: |
          (cd tool/e2e && npm install --no-audit --no-fund)
          node tool/e2e/harness.js > "$RUNNER_TEMP/e2e.json" &
          for i in $(seq 1 20); do [ -s "$RUNNER_TEMP/e2e.json" ] && break; sleep 0.5; done
          echo "E2E_CONFIG=$RUNNER_TEMP/e2e.json" >> "$GITHUB_ENV"
      - run: flutter test
