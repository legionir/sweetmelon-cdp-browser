<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>CDP Browser</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main id="setup" class="screen">
    <h1>Remote CDP Browser</h1>
    <p class="hint">Connects to cdp-browser-emulator through ws-cf-tunnel and SSH</p>

    <form id="form" autocomplete="off">
      <label>Tunnel URL (TUNNEL_URL)
        <input name="tunnelUrl" type="url" inputmode="url" placeholder="wss://&hellip;.workers.dev" required />
      </label>
      <label>Client token (AUTH_TOKEN)
        <input name="authToken" type="password" required />
      </label>
      <label>Server ID (SERVER_ID)
        <input name="serverId" type="text" required />
      </label>
      <label>SSH user
        <input name="sshUser" type="text" required />
      </label>
      <label>SSH password
        <input name="sshPassword" type="password" />
      </label>
      <details>
        <summary>Advanced settings</summary>
        <label>Gateway port on the server
          <input name="remotePort" type="number" min="1" max="65535" value="3000" />
        </label>
        <label>Gateway token (GATEWAY_TOKEN, required if the server has one)
          <input name="gatewayToken" type="password" />
        </label>
        <label>SSH private key (PEM, optional)
          <textarea name="sshPrivateKey" rows="3"></textarea>
        </label>
      </details>
      <label class="check"><input type="checkbox" name="remember" checked /> Remember settings securely on this device</label>
      <button type="submit" id="btnConnect">Connect</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </main>

  <section id="browser" class="screen" hidden>
    <header class="bar">
      <span id="dot" class="dot"></span>
      <span id="barText">Connected</span>
      <button id="btnReload" type="button" aria-label="Reload">&#10227;</button>
      <button id="btnDisconnect" type="button">Disconnect</button>
    </header>
    <iframe id="frame" title="remote browser" referrerpolicy="no-referrer"></iframe>
  </section>

  <script src="js/native-sdk.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
